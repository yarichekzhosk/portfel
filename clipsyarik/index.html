<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ClipsYarik">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>ClipsYarik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Oswald:wght@600&family=Rubik:wght@700&family=Russo+One&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout idea: iOS-style grouped lists, one calm accent, a single column capped at phone width. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#8a8a8e; --line:#e5e5ea;
  --accent:#3b6fd4; --accent-ink:#ffffff; --good:#2f9e63;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#8e8e93; --line:#2c2c2e; --accent:#6b97ec; --accent-ink:#0b1220; --good:#4cc38a; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000; --card:#1c1c1e; --text:#f2f2f7; --muted:#8e8e93; --line:#2c2c2e; --accent:#6b97ec; --accent-ink:#0b1220; --good:#4cc38a; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 var(--font);display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative}
header{padding:calc(env(safe-area-inset-top) + 14px) 20px 6px;display:flex;align-items:center;gap:8px;min-height:56px}
header h1{font-size:30px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em;flex:1}
.back{border:0;background:none;color:var(--accent);font:inherit;font-size:17px;padding:6px 0;cursor:pointer}
main{flex:1;overflow-y:auto;padding:8px 16px 24px;min-height:0}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--accent)}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.group{background:var(--card);border-radius:14px;overflow:hidden;margin:0 0 18px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);min-height:50px}
.row:last-child{border-bottom:0}
.row.tap{cursor:pointer}
.row .grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:13px}
.label{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.03em;margin:4px 16px 8px}
.note{color:var(--muted);font-size:13px;margin:-8px 16px 18px}
input[type=text],input[type=url],textarea{width:100%;border:0;background:none;font:inherit;color:var(--text);outline:none;padding:0}
input::placeholder{color:var(--muted)}
.btn{width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:15px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:default}
.btn+.btn{margin-top:10px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.score{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;min-width:44px;text-align:right}
.rank{width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted);flex:none}
.thumb{width:54px;height:72px;border-radius:8px;flex:none;position:relative;overflow:hidden}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.sel .radio{border-color:var(--accent);background:var(--accent)}
.sel .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink)}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;margin:0 0 16px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:7px;border-radius:8px;color:var(--text);cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.tile{aspect-ratio:9/14;border-radius:10px;background:var(--card);overflow:hidden;position:relative;cursor:pointer;border:2px solid transparent}
.tile.sel{border-color:var(--accent)}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:13px;cursor:pointer}
.swatches{display:flex;gap:12px;padding:14px 16px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
select{font:inherit;color:var(--text);background:none;border:0;max-width:60%}
.empty{text-align:center;color:var(--muted);padding:48px 24px}
/* 9:16 preview */
.phone{width:min(62%,250px);aspect-ratio:9/16;margin:4px auto 18px;border-radius:18px;overflow:hidden;background:#000;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.phone .top,.phone .bot{position:absolute;left:0;right:0;height:42%;overflow:hidden}
.phone .top{top:0}.phone .bot{bottom:0}
.phone video{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:grid;place-items:center;color:rgba(255,255,255,.8);font-size:12px;text-align:center;padding:10px}
.cap{position:absolute;left:6%;right:6%;top:50%;transform:translateY(-50%);text-align:center;font-size:22px;line-height:1.1;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 8px rgba(0,0,0,.6);word-break:break-word}
.chat{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px;max-height:240px;overflow-y:auto}
.msg{padding:8px 12px;border-radius:16px;margin:0 0 6px;max-width:85%;font-size:15px}
.msg.me{background:var(--accent);color:var(--accent-ink);margin-left:auto}
.msg.ai{background:var(--bg)}
.send{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:22px;padding:6px 6px 6px 16px;margin-bottom:18px}
.send button{border:0;border-radius:50%;width:34px;height:34px;background:var(--accent);color:var(--accent-ink);font-size:18px;cursor:pointer;flex:none}
.chunks{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
.chunk{border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit;cursor:pointer}
.chunk:hover{border-color:var(--accent)}
.demo{font-size:12px;color:var(--muted);text-align:center;padding:4px 16px 0}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .22s ease-out}@keyframes in{from{opacity:.0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div id="app">
  <header id="hd"></header>
  <main id="mn"></main>
  <nav id="nv"></nav>
</div>
<script>
"use strict";
/* ---------- данные и состояние ---------- */
const TYPES=["Гонки GTA 5","Резка мыла","Готовка блюд","Чистка ковров","Гонка кубиков","Слайм и песок","Другое"];
const COLORS=[["#ffffff","Белый"],["#f5e27a","Мягкий жёлтый"],["#9be3c0","Мята"],["#8ec5ff","Небесный"],["#ffb38a","Персик"],["#f4a6c0","Пудра"]];
const FONTS=[["Montserrat","Montserrat"],["Oswald","Oswald"],["Rubik","Rubik"],["Russo One","Russo One"],["Unbounded","Unbounded"]];
const SAMPLE="Короче я сидел вчера и думал что это вообще невозможно но потом всё изменилось и я понял главное никогда не сдавайся даже когда никто не верит";
const MOCK=[
 {t:"Момент, когда всё пошло не так",s:9.7,d:"0:38",why:"Резкий поворот в первые 3 секунды, эмоциональная речь"},
 {t:"Неожиданное признание",s:9.2,d:"0:52",why:"Сильный хук, цитируемая фраза"},
 {t:"Главный совет за весь стрим",s:8.8,d:"0:44",why:"Практическая польза, высокая досматриваемость"},
 {t:"Реакция на сюрприз",s:8.1,d:"0:29",why:"Живая реакция, короткая длина"},
 {t:"Смешной эпизод с чатом",s:7.6,d:"0:35",why:"Юмор, но слабее начало"},
 {t:"Рассказ про первый опыт",s:6.9,d:"1:05",why:"Длинновато, середина провисает"}
];
const S={tab:"clips",step:"home",url:"",clips:[],picked:null,ftype:null,fsrc:{kind:"storage",id:null},srcMode:"storage",
  color:COLORS[0][0],font:FONTS[0][0],chunks:[],chat:[{r:"ai",t:"Проверь субтитры выше. Если что-то распознано неверно, напиши, например: «замени сидел на сидела»."}],
  store:[],filter:"Все",upType:TYPES[0],prog:0,deferred:[]};
try{S.deferred=JSON.parse(localStorage.getItem("cy_def")||"[]")}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- хранилище видео (IndexedDB, с запасным вариантом в памяти) ---------- */
const DB={db:null,mem:[],
  open(){return new Promise(res=>{try{const r=indexedDB.open("clipsyarik",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("v",{keyPath:"id"});
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
  tx(m){return this.db.transaction("v",m).objectStore("v")},
  all(){return new Promise(res=>{if(!this.db)return res(this.mem);const q=this.tx("readonly").getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res(this.mem)})},
  put(x){return new Promise(res=>{if(!this.db){this.mem.push(x);return res()}const q=this.tx("readwrite").put(x);q.onsuccess=q.onerror=()=>res()})},
  del(id){return new Promise(res=>{if(!this.db){this.mem=this.mem.filter(x=>x.id!==id);return res()}const q=this.tx("readwrite").delete(id);q.onsuccess=q.onerror=()=>res()})}};
async function loadStore(){const a=await DB.all();S.store=a.map(x=>({...x,url:URL.createObjectURL(x.blob)}))}

/* ---------- каркас ---------- */
const ICON={
 clips:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>',
 store:'<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
 later:'<svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>'};
function shell(title,back){
  $("#hd").innerHTML=(back?`<button class="back" data-a="back">‹ Назад</button><h1 style="font-size:17px;text-align:center;flex:2">${esc(title)}</h1><span style="flex:1"></span>`:`<h1>${esc(title)}</h1>`);
  $("#nv").innerHTML=[["clips","Клипы"],["store","Хранилище"],["later","Отложенные"]].map(([k,n])=>`<button class="${S.tab===k?"on":""}" data-a="tab" data-v="${k}">${ICON[k]}<span>${n}</span></button>`).join("");
}
function render(){
  const m=$("#mn");let h="";
  if(S.tab==="store")h=vStore();
  else if(S.tab==="later")h=vLater();
  else h=({home:vHome,work:vWork,rank:vRank,ftype:vFtype,fsrc:vFsrc,style:vStyle,done:vDone})[S.step]();
  m.innerHTML=h;m.scrollTop=0;
  if(S.step==="style"||S.step==="done")startCaps();
}

/* ---------- экраны ---------- */
function vHome(){
  shell("ClipsYarik");
  return `<div class="label">Ссылка на видео или стрим</div>
  <div class="group"><div class="row"><input id="url" type="url" inputmode="url" placeholder="https://youtube.com/…" value="${esc(S.url)}" autocomplete="off"></div></div>
  <button class="btn" data-a="analyze">Найти лучшие моменты</button>
  <p class="note" style="margin:14px 16px">Приложение распознает речь, выберет самые сильные фрагменты и оценит шанс на популярность.</p>
  <p class="demo">Демо: показаны примерные данные. Реальная обработка видео подключается отдельным сервером.</p>`;
}
const STEPS=["Загружаю видео","Распознаю речь","Ищу сильные моменты","Оцениваю шанс на популярность"];
function vWork(){
  shell("Анализ");
  return `<div class="group" style="margin-top:12px">${STEPS.map((t,i)=>`<div class="row"><span style="width:22px;text-align:center;color:${S.prog>i?"var(--good)":"var(--muted)"}">${S.prog>i?"✓":S.prog===i?"…":"·"}</span><div class="grow" style="${S.prog<i?"color:var(--muted)":""}">${t}</div></div>`).join("")}</div>`;
}
function grad(i){const a=(i*47+200)%360;return `linear-gradient(160deg,hsl(${a} 25% 40%),hsl(${(a+40)%360} 30% 22%))`}
function vRank(){
  shell("Лучшие моменты",true);
  return `<p class="note" style="margin:6px 16px 12px">Отсортировано по оценке популярности (0–10).</p>
  <div class="group">${S.clips.map((c,i)=>`<div class="row tap" data-a="pick" data-v="${i}">
    <div class="rank">${i+1}</div><div class="thumb" style="background:${grad(i)}"></div>
    <div class="grow"><div style="font-weight:600">${esc(c.t)}</div><div class="sub">${c.d} · ${esc(c.why)}</div><div class="bar"><i style="width:${c.s*10}%"></i></div></div>
    <div class="score">${c.s.toFixed(1)}</div></div>`).join("")}</div>
  <p class="note">Остальные лучшие варианты не пропадут: после монтажа они попадут в «Отложенные».</p>`;
}
function vFtype(){
  shell("Что внизу?",true);
  return `<div class="label">Какой тип видео подойдёт к этому фрагменту?</div>
  <div class="group">${TYPES.map(t=>`<div class="row tap ${S.ftype===t?"sel":""}" data-a="ftype" data-v="${esc(t)}"><div class="grow">${esc(t)}</div><div class="radio"></div></div>`).join("")}</div>
  <button class="btn" data-a="toSrc" ${S.ftype?"":"disabled"}>Дальше</button>`;
}
function vFsrc(){
  shell("Видео для низа",true);
  const list=S.store.filter(v=>v.type===S.ftype);
  const own=S.srcMode==="storage"?
   (list.length?`<div class="grid">${list.map(v=>`<div class="tile ${S.fsrc.id===v.id?"sel":""}" data-a="fpick" data-v="${v.id}"><video src="${v.url}" muted playsinline preload="metadata"></video><span>${esc(v.name)}</span></div>`).join("")}</div>`
   :`<div class="empty">В хранилище нет видео типа «${esc(S.ftype)}».<br>Загрузи их во вкладке «Хранилище» или вставь ссылку.</div>`)
   :`<div class="group"><div class="row"><input id="flink" type="url" inputmode="url" placeholder="Ссылка на ролик" value="${esc(S.fsrc.url||"")}" autocomplete="off"></div></div>`;
  const ok=S.srcMode==="storage"?S.fsrc.kind==="storage"&&S.fsrc.id:!!(S.fsrc.url);
  return `<div class="seg"><button class="${S.srcMode==="storage"?"on":""}" data-a="smode" data-v="storage">Из хранилища</button><button class="${S.srcMode==="link"?"on":""}" data-a="smode" data-v="link">По ссылке</button></div>${own}
  <button class="btn" data-a="toStyle" ${ok?"":"disabled"}>Дальше</button>`;
}
function phone(){
  const bot=S.fsrc.kind==="storage"&&S.fsrc.id?S.store.find(v=>v.id===S.fsrc.id):null;
  const clip=S.clips[S.picked]||MOCK[0];
  return `<div class="phone"><div class="top"><div class="ph" style="background:${grad(S.picked||0)}">${esc(clip.t)}</div></div>
   <div class="cap" id="cap" style="color:${S.color};font-family:'${S.font}',sans-serif"></div>
   <div class="bot">${bot?`<video src="${bot.url}" autoplay muted loop playsinline></video>`:`<div class="ph" style="background:#26262a">${S.fsrc.url?"Видео по ссылке":esc(S.ftype||"")}</div>`}</div></div>`;
}
function vStyle(){
  shell("Субтитры",true);
  return phone()+`
  <div class="label">Цвет</div>
  <div class="group"><div class="swatches">${COLORS.map(([c,n])=>`<button class="sw ${S.color===c?"on":""}" style="background:${c}" title="${n}" aria-label="${n}" data-a="color" data-v="${c}"></button>`).join("")}
   <label class="sw" style="background:conic-gradient(#aaa,#ddd,#aaa);display:grid;place-items:center;overflow:hidden" title="Свой цвет"><input type="color" id="cc" value="${S.color}" style="opacity:0;width:100%;height:100%"></label></div></div>
  <div class="label">Шрифт</div>
  <div class="group"><div class="row"><div class="grow">Шрифт субтитров</div><select id="font">${FONTS.map(([f,n])=>`<option ${S.font===f?"selected":""}>${n}</option>`).join("")}</select></div></div>
  <div class="label">Текст (нажми на слово, чтобы поправить)</div>
  <div class="group"><div class="chunks">${S.chunks.map((c,i)=>`<button class="chunk" data-a="edit" data-v="${i}">${esc(c)}</button>`).join("")}</div></div>
  <div class="label">Поправить через чат</div>
  <div class="chat" id="chat">${S.chat.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join("")}</div>
  <form class="send" id="cf"><input type="text" id="ci" placeholder="Например: замени сидел на сидела" autocomplete="off"><button aria-label="Отправить">↑</button></form>
  <button class="btn" data-a="render">Собрать видео</button>
  <p class="demo" style="margin-top:12px">В демо чат понимает команду «замени … на …». С сервером здесь будет настоящий ИИ.</p>`;
}
function vDone(){
  shell("Готово",true);
  return phone()+`<div class="group"><div class="row"><div class="grow"><b>Ролик собран</b><div class="sub">Рендер подключится вместе с сервером. Сейчас это предпросмотр.</div></div></div></div>
  <div class="group"><div class="row"><div class="grow">Отложено ${S.lastSaved||0} фрагм. на потом</div><a class="sub" href="#" data-a="tab" data-v="later" style="color:var(--accent)">Открыть</a></div></div>
  <button class="btn" data-a="again">Новая ссылка</button>`;
}
function vStore(){
  shell("Хранилище");
  const types=["Все",...TYPES];
  const list=S.store.filter(v=>S.filter==="Все"||v.type===S.filter);
  return `<div class="group"><div class="row"><div class="grow">Тип нового видео</div><select id="uptype">${TYPES.map(t=>`<option ${S.upType===t?"selected":""}>${t}</option>`).join("")}</select></div></div>
  <label class="btn" style="display:block;text-align:center;margin-bottom:18px;cursor:pointer">Загрузить видео<input type="file" id="up" accept="video/*" multiple hidden></label>
  <div class="group"><div class="row"><div class="grow">Показать</div><select id="flt">${types.map(t=>`<option ${S.filter===t?"selected":""}>${t}</option>`).join("")}</select></div></div>
  ${list.length?`<div class="grid">${list.map(v=>`<div class="tile"><video src="${v.url}" muted playsinline preload="metadata"></video><span>${esc(v.type)}</span><button class="x" data-a="del" data-v="${v.id}" aria-label="Удалить">✕</button></div>`).join("")}</div>`
  :`<div class="empty">Пока пусто. Загрузи «залипательные» ролики: резку мыла, ковры, гонки.</div>`}`;
}
function vLater(){
  shell("Отложенные");
  return S.deferred.length?`<p class="note" style="margin:6px 16px 12px">Лучшие фрагменты, которые ты не выбрал.</p><div class="group">${S.deferred.map((c,i)=>`<div class="row"><div class="thumb" style="background:${grad(i+3)}"></div><div class="grow"><div style="font-weight:600">${esc(c.t)}</div><div class="sub">${c.d} · ${esc(c.from)}</div></div><div class="score">${c.s.toFixed(1)}</div></div>`).join("")}</div>
  <button class="btn ghost" data-a="clearlater">Очистить список</button>`:`<div class="empty">Здесь появятся оставшиеся лучшие фрагменты после монтажа.</div>`;
}

/* ---------- субтитры: по 1–3 слова ---------- */
function chunk(text){const w=text.trim().split(/\s+/),o=[];let i=0;const pat=[2,1,3,2,2,3,1,2];let k=0;
  while(i<w.length){const n=Math.min(pat[k++%pat.length],w.length-i);o.push(w.slice(i,i+n).join(" "));i+=n}return o}
let capT=null;
function startCaps(){clearInterval(capT);let i=0;const el=()=>document.getElementById("cap");
  const tick=()=>{const e=el();if(!e){clearInterval(capT);return}e.textContent=S.chunks[i%S.chunks.length]||"";i++};
  tick();capT=setInterval(tick,650)}

/* ---------- действия ---------- */
function saveDef(){try{localStorage.setItem("cy_def",JSON.stringify(S.deferred))}catch(e){}}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==="tab"){e.preventDefault();S.tab=v;return render()}
  if(a==="back"){S.step=({rank:"home",ftype:"rank",fsrc:"ftype",style:"fsrc",done:"style"})[S.step]||"home";return render()}
  if(a==="analyze"){S.url=$("#url").value.trim();if(!S.url){$("#url").focus();return}
    S.step="work";S.prog=0;render();
    for(let i=1;i<=STEPS.length;i++){await new Promise(r=>setTimeout(r,800));S.prog=i;if(S.step==="work")render()}
    S.clips=MOCK.map(x=>({...x}));S.step="rank";return render()}
  if(a==="pick"){S.picked=+v;S.step="ftype";return render()}
  if(a==="ftype"){S.ftype=v;return render()}
  if(a==="toSrc"){S.fsrc={kind:"storage",id:null};S.step="fsrc";return render()}
  if(a==="smode"){S.srcMode=v;S.fsrc=v==="storage"?{kind:"storage",id:null}:{kind:"link",url:""};return render()}
  if(a==="fpick"){S.fsrc={kind:"storage",id:v};return render()}
  if(a==="toStyle"){if(S.srcMode==="link")S.fsrc={kind:"link",url:$("#flink").value.trim()};
    S.chunks=chunk(SAMPLE);S.step="style";return render()}
  if(a==="color"){S.color=v;return render()}
  if(a==="edit"){return editChunk(+v)}
  if(a==="render"){const rest=S.clips.filter((_,i)=>i!==S.picked).slice(0,5);
    S.deferred=[...rest.map(c=>({...c,from:"из «"+(S.url.replace(/^https?:\/\//,"").slice(0,24)||"ссылка")+"»"})),...S.deferred];
    S.lastSaved=rest.length;saveDef();S.step="done";return render()}
  if(a==="again"){S.step="home";S.url="";S.picked=null;S.ftype=null;return render()}
  if(a==="del"){e.stopPropagation();await DB.del(v);await loadStore();return render()}
  if(a==="clearlater"){S.deferred=[];saveDef();return render()}
});
/* правка слова: встроенное поле вместо prompt() */
function editChunk(i){
  const btn=document.querySelector(`.chunk[data-v="${i}"]`);if(!btn)return;
  const inp=document.createElement("input");inp.type="text";inp.value=S.chunks[i];inp.className="chunk";inp.style.width=Math.max(90,btn.offsetWidth+24)+"px";
  btn.replaceWith(inp);inp.focus();inp.select();
  const done=()=>{const t=inp.value.trim();if(t)S.chunks[i]=t;render()};
  inp.addEventListener("blur",done);inp.addEventListener("keydown",k=>{if(k.key==="Enter")inp.blur()});
}
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="font"){S.font=t.value;render()}
  if(t.id==="cc"){S.color=t.value;render()}
  if(t.id==="uptype")S.upType=t.value;
  if(t.id==="flt"){S.filter=t.value;render()}
  if(t.id==="up"){for(const f of t.files){await DB.put({id:"v"+Date.now()+Math.random().toString(36).slice(2,6),name:f.name,type:S.upType,blob:f})}
    await loadStore();render()}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="cf")return;e.preventDefault();
  const i=$("#ci"),q=i.value.trim();if(!q)return;
  S.chat.push({r:"me",t:q});
  const m=q.match(/(?:замени|исправь)\s+[«"]?(.+?)[»"]?\s+на\s+[«"]?(.+?)[»"]?\s*$/i);
  if(m){const from=m[1].toLowerCase(),to=m[2];let n=0;
    S.chunks=S.chunks.map(c=>{const r=c.toLowerCase().split(from).join("\u0000");if(r.includes("\u0000")){n++;return c.replace(new RegExp(from.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),to)}return c});
    S.chat.push({r:"ai",t:n?`Готово, исправил: ${n} шт.`:`Не нашёл «${m[1]}» в тексте.`})}
  else S.chat.push({r:"ai",t:"В демо я понимаю только «замени … на …». С подключённым сервером пойму любую просьбу."});
  render();const c=$("#chat");if(c)c.scrollTop=c.scrollHeight;
});
document.addEventListener("input",e=>{if(e.target.id==="url")S.url=e.target.value});

DB.open().then(loadStore).then(render);
</script>
</body>
