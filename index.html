<meta name="apple-mobile-web-app-title" content="Портфель">
<title>Портфель</title>
<style>
:root{--bg:#000;--cell:#1c1c1e;--cell2:#2c2c2e;--sep:rgba(84,84,88,.55);--l2:rgba(235,235,245,.6);--l3:rgba(235,235,245,.3);--tint:#0a84ff;--up:#30d158;--down:#ff453a;--warn:#ff9f0a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;font-size:17px;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}

a{color:inherit;text-decoration:none}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.lt{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:20px 0 14px}
.lt p{margin:4px 0 0;color:var(--l2);font-size:15px;text-transform:capitalize}
.muted{color:var(--l2)}.sm{font-size:13px}.up{color:var(--up)}.down{color:var(--down)}
.tn{font-variant-numeric:tabular-nums}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card{background:var(--cell);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card.big .num{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:2px 0}
.num{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.gt{color:var(--l2);font-size:13px;text-transform:uppercase;letter-spacing:.3px;margin:20px 16px 6px}
.grp{background:var(--cell);border-radius:14px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative}
.row+.row::before,.kv+.kv::before{content:"";position:absolute;left:68px;right:0;top:0;height:.5px;background:var(--sep)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;position:relative;font-size:16px}
.kv+.kv::before{left:16px}
.kv.col{flex-direction:column;gap:6px}
.grow{flex:1;min-width:0}
.r1,.r2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.r2{margin-top:2px;font-size:13px}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--l3);font-size:22px}
.logo{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.p-sell{background:rgba(255,69,58,.18);color:var(--down)}.p-buy{background:rgba(48,209,88,.18);color:var(--up)}.p-hold{background:var(--cell2);color:var(--l2)}
.warn{background:rgba(255,159,10,.14);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.empty{padding:16px;color:var(--l2);text-align:center;font-size:15px}
.foot{color:var(--l3);font-size:12px;text-align:center;margin:16px 8px}
.rb{margin-top:6px}.rb-t{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--up),var(--cell2) 50%,var(--down));position:relative;margin:8px 0}
.rb-t i{position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;background:#fff;transform:translateX(-50%)}
.rb-l{display:flex;justify-content:space-between;color:var(--l2);font-size:12px}
.chart{width:100%;height:auto;margin-top:8px}
.tabs{display:flex;background:var(--cell2);border-radius:9px;padding:2px;margin-top:12px}
.tabs button{flex:1;border:0;background:none;color:#fff;font:inherit;font-size:14px;padding:5px;border-radius:7px}
.tabs button.on{background:#636366}
.why{margin:0;padding-left:18px;color:var(--l2);font-size:15px;line-height:1.4}.why li{margin:4px 0}
.back{display:inline-block;color:var(--tint);padding:8px 0}
.skel{height:90px;border-radius:14px;background:var(--cell);margin-bottom:12px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.5}}
.btns{display:flex;gap:6px;align-items:center}
.ibtn{border:0;background:none;color:var(--tint);font:inherit;font-size:22px;padding:4px 8px}
.ibtn.txt{font-size:17px}.ibtn.strong{font-weight:600}
.ibtn.spin{animation:r 1s linear infinite;display:inline-block}@keyframes r{to{transform:rotate(360deg)}}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.months i{font-style:normal;font-size:12px;text-align:center;padding:4px 0;border-radius:6px;background:var(--cell2);color:var(--l3)}
.months i.on{background:var(--tint);color:#fff;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(28,28,30,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{display:flex;width:100%;max-width:560px}
.tab{flex:1;text-align:center;color:var(--l3);font-size:10px;padding:4px 0}
.tab b{display:block;font-size:22px;font-weight:400;line-height:1.2}
.tab.on{color:var(--tint)}
#sheet .shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10}
#sheet .panel{position:fixed;left:0;right:0;bottom:0;top:40px;background:#000;border-radius:14px 14px 0 0;z-index:11;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:.5px solid var(--sep)}
.pb{overflow:auto;padding:8px 16px calc(40px + env(safe-area-inset-bottom))}
.erow{display:flex;gap:8px;align-items:flex-end;background:var(--cell);border-radius:12px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
.erow.wrap label{flex:1 1 40%}
.en{width:100%;font-size:15px}
.erow label{display:flex;flex-direction:column;font-size:11px;color:var(--l2);gap:2px;flex:1}
.erow input[type=text],.erow input:not([type]){width:100%;background:var(--cell2);border:0;border-radius:8px;color:#fff;font:inherit;font-size:16px;padding:8px}
.erow label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:#fff;flex-basis:100%}
.del{border:0;background:var(--cell2);color:var(--down);border-radius:8px;width:36px;height:36px;font-size:16px}
.btn{border:0;background:var(--tint);color:#fff;font:inherit;font-weight:600;border-radius:12px;padding:12px;width:100%;margin-top:6px}
.btn.danger{background:var(--cell2);color:var(--down);margin-top:20px}
</style>
</head>

const SIGNAL_LABEL                             = {
  strong_sell: "Продавать",
  sell: "Частично продать",
  hold: "Держать",
  buy: "Докупать",
  strong_buy: "Покупать на дне",
};

const pct = (a        , b        ) => (b ? (a / b - 1) * 100 : 0);

function sma(values          , n        )                {
  if (values.length < n) return null;
  const slice = values.slice(-n);
  return slice.reduce((s, v) => s + v, 0) / n;
}

function rsi(values          , n = 14)                {
  if (values.length < n + 1) return null;
  let gain = 0;
  let loss = 0;
  for (let i = 1; i <= n; i++) {
    const d = values[i] - values[i - 1];
    if (d > 0) gain += d;
    else loss -= d;
  }
  let avgG = gain / n;
  let avgL = loss / n;
  for (let i = n + 1; i < values.length; i++) {
    const d = values[i] - values[i - 1];
    avgG = (avgG * (n - 1) + Math.max(d, 0)) / n;
    avgL = (avgL * (n - 1) + Math.max(-d, 0)) / n;
  }
  if (avgG === 0 && avgL === 0) return 50;
  if (avgL === 0) return 100;
  if (avgG === 0) return 0;
  const rs = avgG / avgL;
  return 100 - 100 / (1 + rs);
}

function range(candles          , price        )        {
  if (!candles.length) return { min: price, max: price, pos: null };
  const min = Math.min(price, ...candles.map(c => c.low));
  const max = Math.max(price, ...candles.map(c => c.high));
  return { min, max, pos: max > min ? (price - min) / (max - min) : 0.5 };
}

/** Свечи за последние `days` календарных дней (на бирже бывают торги в выходные). */
function since(candles          , days        )           {
  if (!candles.length) return [];
  const last = new Date(candles[candles.length - 1].date).getTime();
  const from = last - days * 86400000;
  return candles.filter(c => new Date(c.date).getTime() > from);
}

function back(candles          , days        , price        )                {
  if (candles.length < 2) return null;
  const last = new Date(candles[candles.length - 1].date).getTime();
  const target = last - days * 86400000;
  if (new Date(candles[0].date).getTime() > target) return null;
  let ref                = null;
  for (const c of candles) {
    if (new Date(c.date).getTime() <= target) ref = c;
    else break;
  }
  return ref ? pct(price, ref.close) : null;
}

/**
 * candles — дневные свечи по возрастанию даты. Текущая цена заменяет свечу только если она
 * сегодняшняя; иначе добавляется временная свеча на сегодня (today, YYYY-MM-DD по Москве).
 */
function computeMetrics(src          , livePrice                , prevClose                , today         )          {
  let candles = src;
  const lastC = src[src.length - 1];
  if (livePrice && lastC) {
    if (!today || lastC.date === today) {
      candles = [...src.slice(0, -1), { ...lastC, close: livePrice, high: Math.max(lastC.high, livePrice), low: Math.min(lastC.low, livePrice) }];
    } else if (today > lastC.date) {
      candles = [...src, { date: today, open: livePrice, high: livePrice, low: livePrice, close: livePrice }];
    }
  }
  const closes = candles.map(c => c.close);
  const price = livePrice ?? closes[closes.length - 1] ?? 0;
  const prev = prevClose ?? closes[closes.length - 2] ?? null;
  const year = since(candles, 365);
  const yHigh = year.length ? Math.max(price, ...year.map(c => c.high)) : null;
  return {
    price,
    change1d: prev ? pct(price, prev) : null,
    change1w: back(candles, 7, price),
    change1m: back(candles, 30, price),
    change1y: back(candles, 365, price),
    range1w: range(since(candles, 7), price),
    range1m: range(since(candles, 30), price),
    range1y: range(year, price),
    rsi14: rsi(closes),
    sma20: sma(closes, 20),
    sma50: sma(closes, 50),
    sma200: sma(closes, 200),
    drawdownFromHigh: yHigh ? pct(price, yHigh) : null,
  };
}

const fmt = (n        , d = 0) => n.toLocaleString("ru-RU", { maximumFractionDigits: d, minimumFractionDigits: d });

/**
 * Простая прозрачная модель: набирает «очки продажи» и «очки покупки»,
 * разница определяет сигнал. Каждое очко сопровождается объяснением.
 */
function computeSignal(m         , avgPrice                , daysToDividend                )         {
  let buy = 0;
  let sell = 0;
  const reasons           = [];
  const p1m = m.range1m.pos;
  const p1y = m.range1y.pos;
  const p1w = m.range1w.pos;

  if (p1y !== null && p1y >= 0.9) {
    sell += 2;
    reasons.push(`Цена у годового максимума (${fmt(m.range1y.max, 2)} ₽) — исторически дорого.`);
  } else if (p1y !== null && p1y >= 0.75) {
    sell += 1;
    reasons.push("Цена в верхней четверти годового диапазона.");
  } else if (p1y !== null && p1y <= 0.1) {
    buy += 2;
    reasons.push(`Цена у годового минимума (${fmt(m.range1y.min, 2)} ₽) — близко ко дну за год.`);
  } else if (p1y !== null && p1y <= 0.25) {
    buy += 1;
    reasons.push("Цена в нижней четверти годового диапазона.");
  }

  if (p1m !== null && p1m >= 0.9) {
    sell += 1;
    reasons.push("Максимум за месяц — хороший момент частично зафиксировать.");
  } else if (p1m !== null && p1m <= 0.1) {
    buy += 1;
    reasons.push("Минимум за месяц — цена на локальном дне.");
  }

  if (p1w !== null && p1w >= 0.95 && (m.change1w ?? 0) > 4) {
    sell += 1;
    reasons.push(`За неделю +${fmt(m.change1w ?? 0, 1)}% — резкий рост часто откатывается.`);
  } else if (p1w !== null && p1w <= 0.05 && (m.change1w ?? 0) < -4) {
    buy += 1;
    reasons.push(`За неделю ${fmt(m.change1w ?? 0, 1)}% — сильная распродажа.`);
  }

  if (m.rsi14 !== null) {
    if (m.rsi14 >= 72) {
      sell += 2;
      reasons.push(`RSI ${fmt(m.rsi14)} — бумага перекуплена.`);
    } else if (m.rsi14 >= 65) {
      sell += 1;
      reasons.push(`RSI ${fmt(m.rsi14)} — близко к перекупленности.`);
    } else if (m.rsi14 <= 28) {
      buy += 2;
      reasons.push(`RSI ${fmt(m.rsi14)} — бумага перепродана.`);
    } else if (m.rsi14 <= 35) {
      buy += 1;
      reasons.push(`RSI ${fmt(m.rsi14)} — близко к перепроданности.`);
    }
  }

  if (m.sma50) {
    const d = pct(m.price, m.sma50);
    if (d >= 10) {
      sell += 1;
      reasons.push(`Цена на ${fmt(d, 0)}% выше средней за 50 дней — оторвалась от тренда.`);
    } else if (d <= -10) {
      buy += 1;
      reasons.push(`Цена на ${fmt(-d, 0)}% ниже средней за 50 дней.`);
    }
  }

  if (m.sma200) {
    if (m.price > m.sma200) reasons.push("Выше средней за 200 дней — долгосрочный тренд вверх.");
    else reasons.push("Ниже средней за 200 дней — долгосрочный тренд вниз, докупать частями.");
  }

  if (avgPrice && avgPrice > 0) {
    const pl = pct(m.price, avgPrice);
    if (pl >= 20) {
      sell += 1;
      reasons.push(`Ты в плюсе на ${fmt(pl, 0)}% от своей средней — можно забрать часть прибыли.`);
    } else if (pl <= -15) {
      buy += 1;
      reasons.push(`Цена на ${fmt(-pl, 0)}% ниже твоей средней — докупка снизит среднюю.`);
    }
  }

  if (daysToDividend !== null && daysToDividend !== undefined && daysToDividend >= 0 && daysToDividend <= 45) {
    reasons.push(
      `Ожидаемая дивидендная отсечка примерно через ${daysToDividend} дн. — продавать до неё невыгодно, после отсечки цена обычно проседает (гэп).`,
    );
    if (sell > 0) sell -= 1;
  }

  const score = buy - sell;
  let kind             = "hold";
  if (score >= 4) kind = "strong_buy";
  else if (score >= 2) kind = "buy";
  else if (score <= -4) kind = "strong_sell";
  else if (score <= -2) kind = "sell";

  const short                             = {
    strong_buy: "Цена на дне — хороший момент купить",
    buy: "Ниже обычного — можно докупить",
    hold: "Без явного сигнала — держим",
    sell: "Дорого — можно частично зафиксировать",
    strong_sell: "У максимумов — момент продать",
  };
  if (!reasons.length) reasons.push("Цена в середине диапазонов, индикаторы нейтральны.");

  let title = SIGNAL_LABEL[kind];
  if (kind === "sell" && avgPrice && m.price > avgPrice) title = "Фиксировать прибыль";
  return { kind, title, short: short[kind], score, reasons };
}

const DIVIDENDS = raw                                                                    ;

/** Сегодняшняя дата по Москве в формате YYYY-MM-DD. */
function moscowToday(now = new Date())         {
  return new Date(now.getTime() + 3 * 3600_000).toISOString().slice(0, 10);
}

/** Разница в днях между двумя датами YYYY-MM-DD. */
function dayDiff(from        , to        )         {
  return Math.round((Date.parse(`${to}T00:00:00Z`) - Date.parse(`${from}T00:00:00Z`)) / 86400000);
}

const ymd = (y        , m        , d        ) => `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

                                
                 
                   
               
               
                 
                        
                 
                
  

function isNoDividend(info                          ) {
  return !!info && info.next?.status === "не ожидается";
}

function activeWindows(info                          ) {
  return (info?.schedule ?? []).filter(w => !w.historicalOnly);
}

/** Ближайшая отсечка: объявленная/прогнозная дата или ближайший типичный месяц. */
function estimateNextDividend(ticker        , today = moscowToday())                          {
  const info = DIVIDENDS.items[ticker];
  if (!info || isNoDividend(info)) return null;
  const n = info.next;
  const windows = activeWindows(info);

  if (n?.recordDate && /^\d{4}-\d{2}-\d{2}$/.test(n.recordDate) && dayDiff(today, n.recordDate) >= 0) {
    const m = Number(n.recordDate.slice(5, 7));
    const w = windows.find(s => s.months.includes(m)) ?? windows[0];
    return {
      ticker,
      date: n.recordDate,
      days: dayDiff(today, n.recordDate),
      exact: /утвержд|рекомендо/i.test(n.status),
      amount: n.amount ?? null,
      status: n.status,
      label: w?.label ?? "Дивиденд",
    };
  }

  // Запасной вариант: ближайший типичный месяц (берём середину месяца), сумма неизвестна.
  const [ty, tm] = today.split("-").map(Number);
  let best                          = null;
  for (const w of windows) {
    for (const m of w.months) {
      const y = m > tm || (m === tm && dayDiff(today, ymd(ty, m, 15)) >= 0) ? ty : ty + 1;
      const date = ymd(y, m, 15);
      const days = dayDiff(today, date);
      if (!best || days < best.days) {
        best = { ticker, date, days, exact: false, amount: null, status: "ориентир по прошлым годам", label: w.label };
      }
    }
  }
  return best;
}

const MONTHS_GEN = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];

/** «2026-12-09» → «9 декабря»; год добавляется, только если он не текущий (по Москве). */
function ruDate(iso        ) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if (!m) return iso;
  const year = m[1] !== moscowToday().slice(0, 4) ? ` ${m[1]}` : "";
  return `${Number(m[3])} ${MONTHS_GEN[Number(m[2]) - 1]}${year}`;
}

/* ===== Мосбиржа (ISS) ===== */
const ISS = "https://iss.moex.com/iss";
let jsonpN = 0;
function jsonp(url) {
  return new Promise((resolve, reject) => {
    const name = "__moex" + (++jsonpN) + "_" + Date.now();
    const sc = document.createElement("script");
    const done = () => { delete window[name]; sc.remove(); };
    window[name] = d => { done(); resolve(d); };
    sc.onerror = () => { done(); reject(new Error("jsonp")); };
    sc.src = url.replace(".json?", ".jsonp?") + "&callback=" + name;
    document.head.appendChild(sc);
  });
}
const TRANSPORTS = [
  u => fetch(u).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
  u => jsonp(u),
  u => fetch("https://corsproxy.io/?" + encodeURIComponent(u)).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
];
let tIdx = 0;
const lastErrors = [];

async function getJson(url) {
  let lastErr;
  for (let k = 0; k < TRANSPORTS.length; k++) {
    const i = (tIdx + k) % TRANSPORTS.length;
    try {
      const j = await Promise.race([
        TRANSPORTS[i](url),
        new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 12000)),
      ]);
      tIdx = i;
      return j;
    } catch (e) { lastErr = e; lastErrors.push("способ " + (i + 1) + ": " + (e && e.message)); }
  }
  throw lastErr;
}

function rows(block) {
  if (!block) return [];
  return block.data.map(r => Object.fromEntries(block.columns.map((c, i) => [c, r[i]])));
}
const boardOf = h => (h.kind === "fund" ? "TQTF" : "TQBR");
const isoDaysAgo = d => new Date(Date.now() - d * 86400000).toISOString().slice(0, 10);

async function fetchQuotes(holdings) {
  const out = {};
  const boards = {};
  holdings.forEach(h => (boards[boardOf(h)] = boards[boardOf(h)] || []).push(h.ticker));
  await Promise.all(Object.entries(boards).map(async ([board, tickers]) => {
    const url = `${ISS}/engines/stock/markets/shares/boards/${board}/securities.json?iss.meta=off&iss.only=marketdata,securities` +
      `&securities=${tickers.join(",")}&marketdata.columns=SECID,LAST,MARKETPRICE,LCURRENTPRICE,UPDATETIME&securities.columns=SECID,PREVPRICE`;
    try {
      const j = await getJson(url);
      const prev = Object.fromEntries(rows(j.securities).map(r => [r.SECID, r.PREVPRICE]));
      for (const r of rows(j.marketdata)) {
        out[r.SECID] = { last: r.LAST ?? r.LCURRENTPRICE ?? r.MARKETPRICE ?? null, prev: prev[r.SECID] ?? null };
      }
    } catch (e) { console.warn("quotes", board, e); }
  }));
  return out;
}

async function fetchCandles(ticker, board, isIndex) {
  const base = isIndex
    ? `${ISS}/engines/stock/markets/index/securities/${ticker}/candles.json`
    : `${ISS}/engines/stock/markets/shares/boards/${board}/securities/${ticker}/candles.json`;
  const all = [];
  let start = 0;
  for (let page = 0; page < 3; page++) {
    const j = await getJson(`${base}?iss.meta=off&interval=24&from=${isoDaysAgo(400)}&start=${start}`);
    const part = rows(j.candles).map(r => ({ date: String(r.begin).slice(0, 10), open: r.open, high: r.high, low: r.low, close: r.close }));
    all.push(...part);
    if (part.length < 500) break;
    start += part.length;
  }
  return all;
}

async function pool(items, n, fn) {
  const res = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; res[k] = await fn(items[k]); }
  }));
  return res;
}

/* ===== Снимок рынка ===== */
const state = { snap: null, loading: false, error: null, updatedAt: null, fromCache: false };

function moodOf(m) {
  if (!m) return "Нет данных";
  const p = m.range1y.pos ?? 0.5;
  if (p <= 0.15) return "Рынок у годового дна";
  if (p <= 0.35) return "Рынок под давлением";
  if (p >= 0.85) return "Рынок у максимумов";
  if (p >= 0.65) return "Рынок растёт";
  return "Рынок в боковике";
}

function buildSnapshot(pf, quotes, candlesBy, indexCandles) {
  const today = moscowToday();
  const positions = pf.holdings.map(h => {
    const candles = candlesBy[h.ticker] || [];
    const q = quotes[h.ticker];
    const live = q && q.last ? q.last : null;
    const metrics = candles.length ? computeMetrics(candles, live, q ? q.prev : null, today) : null;
    const price = live ?? (metrics ? metrics.price : null);
    const value = (price ?? h.avgPrice) * h.qty;
    const cost = h.avgPrice * h.qty;
    const nd = estimateNextDividend(h.ticker, today);
    const signal = metrics ? computeSignal(metrics, h.avgPrice, nd ? nd.days : null) : null;
    const change1d = metrics ? metrics.change1d : null;
    return { ...h, price, value, cost, pl: value - cost, plPct: cost ? (value / cost - 1) * 100 : 0,
      change1d, metrics, signal, stale: price === null, nextDividend: nd, candles };
  });
  const invested = positions.reduce((s, p) => s + p.value, 0);
  const cost = positions.reduce((s, p) => s + p.cost, 0);
  const dayChange = positions.reduce((s, p) => {
    if (p.change1d == null || p.price == null) return s;
    return s + (p.price - p.price / (1 + p.change1d / 100)) * p.qty;
  }, 0);
  const im = indexCandles.length ? computeMetrics(indexCandles, null, null, today) : null;
  return { total: invested + pf.cash, cost, pl: invested - cost, plPct: cost ? (invested / cost - 1) * 100 : 0,
    dayChange, cash: pf.cash, positions, market: im ? { metrics: im, mood: moodOf(im), price: im.price } : null };
}

const toCandles = arr => (arr || []).map(r => ({ date: r[0], open: r[1], high: r[2], low: r[3], close: r[4] }));

async function loadData() {
  // Основной способ: файл data.json, который GitHub обновляет сам каждые ~15 минут.
  const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("data.json: HTTP " + r.status);
  const d = await r.json();
  const candles = {};
  for (const k in d.candles) candles[k] = toCandles(d.candles[k]);
  return { quotes: d.quotes || {}, candles, index: toCandles(d.index), at: new Date(d.at).getTime() };
}

async function loadDirect(pf) {
  // Запасной способ: напрямую с Мосбиржи (работает не везде).
  const [quotes, idx] = await Promise.all([fetchQuotes(pf.holdings), fetchCandles("IMOEX", null, true).catch(() => [])]);
  const candles = {};
  await pool(pf.holdings, 4, async h => { try { candles[h.ticker] = await fetchCandles(h.ticker, boardOf(h), false); } catch (e) { candles[h.ticker] = []; } });
  if (!Object.keys(quotes).length && !Object.values(candles).some(c => c.length)) throw new Error("Мосбиржа не ответила");
  return { quotes, candles, index: idx, at: Date.now() };
}

async function refresh() {
  if (state.loading) return;
  state.loading = true; state.error = null; render();
  const pf = loadPortfolio();
  let data = null, why = [];
  try { data = await loadData(); } catch (e) { why.push(String(e && e.message || e)); }
  if (!data) { try { data = await loadDirect(pf); } catch (e) { why.push(String(e && e.message || e)); } }
  if (data) {
    writeCache(data);
    state.snap = buildSnapshot(pf, data.quotes, data.candles, data.index);
    state.updatedAt = new Date(data.at); state.fromCache = false;
    const missing = pf.holdings.filter(h => !data.quotes[h.ticker] && !(data.candles[h.ticker] || []).length).map(h => h.ticker);
    if (missing.length) state.error = "Нет данных по: " + missing.join(", ") + ". Новые бумаги появятся после ближайшего обновления данных.";
    const age = Date.now() - data.at;
    if (age > 36 * 3600e3) state.error = "Данные устарели (последнее обновление " + new Date(data.at).toLocaleString("ru-RU") + ").";
  } else {
    const c = readCache();
    if (c.at) {
      state.snap = buildSnapshot(pf, c.quotes || {}, c.candles || {}, c.index || []);
      state.updatedAt = new Date(c.at); state.fromCache = true;
    } else state.snap = buildSnapshot(pf, {}, {}, []);
    state.error = "Не удалось получить котировки — показаны последние сохранённые данные. (" + why.join("; ") + ")";
  }
  state.loading = false; render();
}

/* ===== Форматирование ===== */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (n, d = 2) => n.toLocaleString("ru-RU", { maximumFractionDigits: d, minimumFractionDigits: d });
const rub = n => (n == null ? "—" : nf(n, Math.abs(n) >= 1000 ? 0 : 2) + " ₽");
const sRub = n => (n == null ? "—" : (n > 0 ? "+" : n < 0 ? "−" : "") + nf(Math.abs(n), Math.abs(n) >= 1000 ? 0 : 2) + " ₽");
const price = n => (n == null ? "—" : nf(n, n < 10 ? 3 : 2) + " ₽");
const fpct = n => (n == null ? "—" : (n > 0 ? "+" : n < 0 ? "−" : "") + nf(Math.abs(n), 2) + "%");
const tone = n => (n == null || Math.abs(n) < 0.005 ? "" : n > 0 ? "up" : "down");

function logo(t) {
  const b = BRAND[t] || { bg: "#2c2c2e", fg: "#fff", mark: t.slice(0, 2) };
  return `<span class="logo" style="background:${b.bg};color:${b.fg}">${esc(b.mark)}</span>`;
}
function pill(sig) {
  if (!sig) return `<span class="pill p-hold">Нет данных</span>`;
  const cls = { strong_sell: "p-sell", sell: "p-sell", hold: "p-hold", buy: "p-buy", strong_buy: "p-buy" }[sig.kind];
  return `<span class="pill ${cls}">${esc(sig.title)}</span>`;
}
function rangeBar(r, price_) {
  if (!r || r.pos == null) return "";
  return `<div class="rb"><div class="rb-t"><i style="left:${Math.round(r.pos * 100)}%"></i></div>
    <div class="rb-l"><span>${nf(r.min, 2)}</span><span>${nf(r.max, 2)}</span></div></div>`;
}

function banner() {

}

function chartSvg(candles, days) {
  const pts = candles.slice(-Math.max(5, days));
  if (pts.length < 2) return `<div class="empty">Нет истории цен</div>`;
  const W = 340, H = 150, P = 4;
  const closes = pts.map(c => c.close);
  const mn = Math.min(...closes), mx = Math.max(...closes), span = mx - mn || 1;
  const X = i => P + (i / (pts.length - 1)) * (W - 2 * P);
  const Y = v => P + (1 - (v - mn) / span) * (H - 2 * P);
  const d = closes.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const up = closes[closes.length - 1] >= closes[0];
  const col = up ? "#30d158" : "#ff453a";
  const iMin = closes.indexOf(mn), iMax = closes.indexOf(mx);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".25"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}L${X(pts.length - 1)},${H}L${X(0)},${H}Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(iMax)}" cy="${Y(mx)}" r="3.5" fill="#fff"/><circle cx="${X(iMin)}" cy="${Y(mn)}" r="3.5" fill="#fff"/></svg>
    <div class="rb-l"><span>мин ${nf(mn, 2)}</span><span>макс ${nf(mx, 2)}</span></div>`;
}

    <div class="kv"><span>Средняя цена</span><span class="tn">${price(p.avgPrice)}</span></div>
    <div class="kv"><span>Стоимость</span><span class="tn">${rub(p.value)}</span></div>
    <div class="kv"><span>Прибыль / убыток</span><span class="tn ${tone(p.pl)}">${sRub(p.pl)} (${fpct(p.plPct)})</span></div></div>`;
  if (m) {
    html += `<div class="gt">Показатели</div><div class="grp">
      <div class="kv"><span>За неделю</span><span class="tn ${tone(m.change1w)}">${fpct(m.change1w)}</span></div>
      <div class="kv"><span>За месяц</span><span class="tn ${tone(m.change1m)}">${fpct(m.change1m)}</span></div>
      <div class="kv"><span>За год</span><span class="tn ${tone(m.change1y)}">${fpct(m.change1y)}</span></div>
      <div class="kv"><span>RSI (14)</span><span class="tn">${m.rsi14 == null ? "—" : nf(m.rsi14, 0)}</span></div>
      <div class="kv"><span>Ниже годового максимума</span><span class="tn">${fpct(m.drawdownFromHigh)}</span></div>
      <div class="kv col"><span>Диапазон за месяц</span>${rangeBar(m.range1m)}</div>
      <div class="kv col"><span>Диапазон за год</span>${rangeBar(m.range1y)}</div></div>`;
  }
  if (info) {
    const nd = p.nextDividend;
    html += `<div class="gt">Дивиденды</div><div class="card"><div class="muted sm">${esc(info.frequency)}</div>`;
    if (nd) html += `<div style="margin-top:8px"><b>Ближайшая:</b> ${nd.exact ? "отсечка" : "ориентир"} ${ruDate(nd.date)}${nd.amount ? `, ${price(nd.amount)} на акцию (≈ ${rub(nd.amount * p.qty)} на мои)` : ""}</div>`;
    else html += `<div style="margin-top:8px">Выплат в ближайшее время не ожидается.</div>`;
    if (info.policy) html += `<div class="muted sm" style="margin-top:8px">${esc(info.policy)}</div>`;
    html += `</div>`;
    const pays = (info.payments || []).slice(0, 12);
    if (pays.length) {
      html += `<div class="grp">` + pays.map(x => `<div class="kv"><span>${esc(x.period)} · отсечка ${ruDate(x.recordDate)}</span><span class="tn">${price(x.amount)}</span></div>`).join("") + `</div>`;
    }
  }
  return html + stamp();
}

const MONTHS = ["Янв", "Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек"];
function viewDividends() {
  const pf = loadPortfolio();
  const today = moscowToday();
  const ups = pf.holdings.map(h => ({ h, d: estimateNextDividend(h.ticker, today) })).filter(x => x.d).sort((a, b) => a.d.days - b.d.days);
  const sum = ups.reduce((s, x) => s + (x.d.amount ? x.d.amount * x.h.qty : 0), 0);
  let html = header("Дивиденды", "Примерные сроки по истории выплат");
  html += `<div class="card big"><div class="muted">Ожидаемо ближайшие выплаты</div><div class="num">${rub(sum)}</div>
    <div class="muted sm">Только там, где известна сумма на акцию. Остальное — ориентир по месяцам.</div></div>`;
  html += group("Ближайшие отсечки", ups.map(({ h, d }) => `<a class="row" href="#/stock/${encodeURIComponent(h.ticker)}">${logo(h.ticker)}
    <div class="grow"><div class="r1"><span class="nm">${esc(h.name)}</span><span class="tn">${d.amount ? "≈ " + rub(d.amount * h.qty) : "—"}</span></div>
    <div class="r2"><span class="muted">${d.exact ? "отсечка" : "ориентир"} ${ruDate(d.date)}</span><span class="muted">через ${d.days} дн.</span></div></div></a>`), "Нет данных");
  const cal = pf.holdings.map(h => {
    const info = DIVIDENDS.items[h.ticker];
    if (!info) return "";
    const wins = activeWindows(info);
    if (isNoDividend(info) || !wins.length) return `<div class="kv"><span>${esc(h.name)}</span><span class="muted">не платит</span></div>`;
    const set = new Set(wins.flatMap(w => w.months));
    return `<div class="kv col"><span>${esc(h.name)}</span><div class="months">${MONTHS.map((m, i) => `<i class="${set.has(i + 1) ? "on" : ""}">${m}</i>`).join("")}</div>
      <div class="muted sm">${wins.map(w => esc(w.label + ": реестр " + w.recordWindow + ", деньги " + w.payoutWindow)).join("<br>")}</div></div>`;
  });
  html += `<div class="gt">Когда обычно платят</div><div class="grp">${cal.join("")}</div>`;
  html += `<div class="foot">Данные по дивидендам на ${esc(DIVIDENDS.asOf)}. Точные даты объявляют компании — смотри у брокера.</div>`;
  return html;
}

/* ===== Редактор портфеля ===== */
let draft = null;
function openEditor() { draft = JSON.parse(JSON.stringify(loadPortfolio())); renderEditor(); }
function closeEditor() { draft = null; document.getElementById("sheet").innerHTML = ""; document.body.classList.remove("lock"); }
function renderEditor() {
  document.body.classList.add("lock");
  const rowsHtml = draft.holdings.map((h, i) => `<div class="erow"><div class="en">${esc(h.name)} <span class="muted">${esc(h.ticker)}</span></div>
    <label>Шт<input inputmode="decimal" value="${h.qty}" onchange="edit(${i},'qty',this.value)"></label>
    <label>Средняя ₽<input inputmode="decimal" value="${h.avgPrice}" onchange="edit(${i},'avgPrice',this.value)"></label>
    <button class="del" onclick="delPos(${i})">✕</button></div>`).join("");
  document.getElementById("sheet").innerHTML = `<div class="shade" onclick="closeEditor()"></div><div class="panel">
    <div class="ph"><button class="ibtn txt" onclick="closeEditor()">Отмена</button><b>Портфель</b><button class="ibtn txt strong" onclick="saveEditor()">Готово</button></div>
    <div class="pb">${rowsHtml}
      <div class="gt">Свободные рубли</div><div class="erow"><label style="flex:1">₽<input inputmode="decimal" value="${draft.cash}" onchange="draft.cash=num(this.value)"></label></div>
      <div class="gt">Добавить бумагу</div>
      <div class="erow wrap"><label>Тикер<input id="nt" placeholder="SBER" autocapitalize="characters"></label><label>Название<input id="nn" placeholder="Сбербанк"></label>
        <label>Шт<input id="nq" inputmode="decimal"></label><label>Средняя ₽<input id="na" inputmode="decimal"></label>
        <label class="chk"><input type="checkbox" id="nf"> это фонд (БПИФ)</label>
        <button class="btn" onclick="addPos()">Добавить</button></div>
      <button class="btn danger" onclick="resetPf()">Вернуть исходный портфель</button></div></div>`;
}
const num = v => { const n = parseFloat(String(v).replace(",", ".").replace(/\s/g, "")); return isFinite(n) && n >= 0 ? n : 0; };
function edit(i, k, v) { draft.holdings[i][k] = num(v); }
function delPos(i) { draft.holdings.splice(i, 1); renderEditor(); }
function addPos() {
  const t = document.getElementById("nt").value.trim().toUpperCase();
  const n = document.getElementById("nn").value.trim() || t;
  const q = num(document.getElementById("nq").value), a = num(document.getElementById("na").value);
  if (!t || !q) { alert("Укажи тикер и количество"); return; }
  if (draft.holdings.some(h => h.ticker === t)) { alert("Эта бумага уже есть"); return; }
  draft.holdings.push({ ticker: t, name: n, qty: q, avgPrice: a, kind: document.getElementById("nf").checked ? "fund" : "share" });
  renderEditor();
}
function resetPf() { if (confirm("Вернуть портфель со скриншотов?")) { draft = JSON.parse(JSON.stringify(DEFAULT_PORTFOLIO)); renderEditor(); } }
function saveEditor() {
  draft.holdings = draft.holdings.filter(h => h.qty > 0);
  savePortfolio(draft); closeEditor(); state.snap = null; refresh();
}

/* ===== Роутер ===== */
function render() {
  const h = location.hash || "#/";
  let html, tab = "today";
  if (h.startsWith("#/stock/")) { html = viewStock(decodeURIComponent(h.slice(8))); tab = "portfolio"; }
  else if (h.startsWith("#/portfolio")) { html = viewPortfolio(); tab = "portfolio"; }
  else if (h.startsWith("#/dividends")) { html = viewDividends(); tab = "dividends"; }
  else html = viewToday();
  const y = window.scrollY;
  document.getElementById("app").innerHTML = html;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === tab));
  window.scrollTo(0, state._keep ? y : 0);
}
let lastHash = "";
window.addEventListener("hashchange", () => { state._keep = false; render(); });
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.updatedAt && Date.now() - state.updatedAt.getTime() > 5 * 60000) refresh();
});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { /* офлайн-режим не нужен: данные кэшируются в localStorage */ }
render();
refresh();

</script>
